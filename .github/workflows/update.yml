name: Actualizar cartelera CartelTV

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: carteltv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt
      - name: Actualizar partidos
        run: python scraper/main.py
      - name: Guardar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          git diff --cached --quiet || git commit -m "chore: actualizar cartelera deportiva"
          git pull --rebase origin main
          git push
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir web
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar web
        uses: actions/deploy-pages@v4